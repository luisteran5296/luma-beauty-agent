name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pip-audit
      - run: python -m pytest tests -q
      - run: python -m scripts.evaluate_hardening
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-gateway.txt
      - run: pip-audit -r requirements-evaluation.txt
      - run: pip install uv
      - run: python -m scripts.stage_agent
      - run: uv sync --project agent --locked
      - run: uv run --project agent pytest agent/tests/unit agent/tests/integration -q
      - run: uv export --project agent --no-dev --no-hashes --no-emit-project --output-file reports/agent-requirements.txt
      - run: pip-audit -r reports/agent-requirements.txt
      - name: Check repository credential patterns
        run: python -m scripts.check_public_repo --all
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci && npm audit --audit-level=high && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium && npm test
